<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club DamPadel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../static/css/bootstrap.min.css" th:href="@{/css/bootstrap.min.css}" />
    <link rel="stylesheet" href="../static/css/base.css" th:href="@{/css/base.css}" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body class="d-flex flex-column min-vh-100">

    <div th:replace="~{fragments/base :: header}"></div>

    <main>

        <div class="container my-5 p-3 mx-auto card shadow-lg bg-secondary">

            <form th:action="@{/crearPista/submit}" method="post">

                <input type="hidden" name="id" class="form-control" />

                <div class="row">

                    <div class="col-6">

                        <label for="tipo" class="form-label">Tipo de pista</label>
                        <select name="tipo" id="tipo" class="form-select">
                            <option>Indoor</option>
                            <option>Outdoor</option>
                        </select>

                    </div>

                    <div class="col-6">

                        <label for="suelo" class="form-label">Tipo de suelo</label>
                        <select name="suelo" id="suelo" class="form-select">
                            <option>Césped artificial</option>
                            <option>Cemento poroso</option>
                        </select>

                    </div>

                </div>

                <div class="row my-5">

                    <div class="col-6">

                        <label for="precioHora" class="form-label">Precio por hora</label>
                        <input type="text" name="precioHora" placeholder="Ej: 4.5" id="precioHora" class="form-control"
                            required />

                    </div>

                </div>

                <input type="submit" name="enviar" value="Enviar" class="form-control btn btn-primary mt-5 rounded" />

            </form>

        </div>
    </main>

    <div th:replace="~{fragments/base :: footer}"></div>

</body>

</html>
