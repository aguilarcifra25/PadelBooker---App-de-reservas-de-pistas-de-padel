<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club DamPadel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../static/css/bootstrap.min.css" th:href="@{/css/bootstrap.min.css}" />
    <link rel="stylesheet" href="../static/css/base.css" th:href="@{/css/base.css}" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body class="d-flex flex-column min-vh-100">

    <div th:replace="~{fragments/base :: header}"></div>

    <main class="my-5 mx-5">

        <div class="row">

            <div class="col-12 col-md-8 me-md-5">

                <h1>Error - Algo ha salido mal</h1>

                <hr>

                <p><strong>Lo sentimos:</strong> Se ha producido un error inesperado.</p>

                <p> Si persiste te pedimos que te pongas en contacto con un administrador de nuestro sistema. </p>

                <hr>

                <a th:href="@{/}" class="btn btn-primary mx-auto">Volver a la página de inicio</a>

            </div>

            <div class="col-12 col-md-3">
                <img src="../../static/img/fotoError.png" th:src="@{/img/fotoError.png}" class="img-fluid">
            </div>

        </div>

    </main>

    <div th:replace="~{fragments/base :: footer}"></div>

</body>

</html>
