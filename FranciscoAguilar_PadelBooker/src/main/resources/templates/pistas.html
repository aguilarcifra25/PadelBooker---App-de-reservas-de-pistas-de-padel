<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club DamPadel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../static/css/bootstrap.min.css" th:href="@{/css/bootstrap.min.css}" />
    <link rel="stylesheet" href="../static/css/base.css" th:href="@{/css/base.css}" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body class="d-flex flex-column min-vh-100">

    <div th:replace="~{fragments/base :: header}"></div>

    <main>

        <div class="container my-5">
            <div class="row">

                <div class="col-4" th:each="pista : ${listaPistas}">
                    <div class="card h-100 overflow-hidden rounded shadow-lg">
                        <img class="img-fluid card-img-top w-100 h-100" src="../static/img/pistaIndoor.jpg"
                            th:src="@{/img/pistaIndoor.jpg}" alt=" Card image">
                        <div class="card-body z-1 bg-white">
                            <h4 th:text="|Pista ${pista.tipo} ${#numbers.formatInteger(pista.numero, 2)}|"
                                class="card-title">Pista</h4>
                            <p th:text="${pista.suelo}" class="card-text">Césped artificial</p>
                            <div class="d-grid">
                                <button type="button" class="btn btn-primary">Ver disponibilidad</button>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>

    </main>

    <div th:replace="~{fragments/base :: footer}"></div>

</body>

</html>
