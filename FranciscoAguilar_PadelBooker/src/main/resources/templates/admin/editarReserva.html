<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club DamPadel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../static/css/bootstrap.min.css" th:href="@{/css/bootstrap.min.css}" />
    <link rel="stylesheet" href="../static/css/base.css" th:href="@{/css/base.css}" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body class="d-flex flex-column min-vh-100">

    <div th:replace="~{fragments/base :: header}"></div>

    <main class="mt-5">

        <div class="container my-5 p-3 mx-auto card shadow-lg bg-secondary">

            <form th:action="@{/editarReserva/submit}" th:object="${reserva}" method="post">

                <input type="hidden" th:field="*{codigo}" />
                <input type="hidden" th:field="*{usuario.id}" th:if="*{usuario != null}" />

                <div class="row mb-3">
                    <div class="col-6">
                        <label for="fecha" class="form-label fw-bold">Fecha de reserva</label>
                        <input type="date" class="form-control form-control-lg fs-6"
                            th:min="${#dates.format(#dates.createNow(), 'yyyy-MM-dd')}" th:field="*{fecha}" required />
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-6">
                        <label for="horaEntrada" class="form-label small fw-bold mb-2">Hora entrada</label>
                        <select id="horaEntrada" class="form-select form-select-lg fs-6" th:field="*{horaEntrada}"
                            required>
                            <option value="" disabled selected hidden>--:--</option>
                            <option value="08:00">08:00</option>
                            <option value="08:30">08:30</option>
                            <option value="09:00">09:00</option>
                            <option value="09:30">09:30</option>
                            <option value="10:00">10:00</option>
                            <option value="10:30">10:30</option>
                            <option value="11:00">11:00</option>
                            <option value="11:30">11:30</option>
                            <option value="12:00">12:00</option>
                            <option value="12:30">12:30</option>
                            <option value="13:00">13:00</option>
                            <option value="13:30">13:30</option>
                            <option value="14:00">14:00</option>
                            <option value="14:30">14:30</option>
                            <option value="15:00">15:00</option>
                            <option value="15:30">15:30</option>
                            <option value="16:00">16:00</option>
                            <option value="16:30">16:30</option>
                            <option value="17:00">17:00</option>
                            <option value="17:30">17:30</option>
                            <option value="18:00">18:00</option>
                            <option value="18:30">18:30</option>
                            <option value="19:00">19:00</option>
                            <option value="19:30">19:30</option>
                            <option value="20:00">20:00</option>
                            <option value="20:30">20:30</option>
                            <option value="21:00">21:00</option>
                            <option value="21:30">21:30</option>
                            <option value="22:00">22:00</option>
                        </select>
                    </div>

                    <div class="col-6">
                        <label for="horaSalida" class="form-label small fw-bold mb-2">Hora salida</label>
                        <select id="horaSalida" class="form-select form-select-lg fs-6" th:field="*{horaSalida}"
                            required>
                            <option value="" disabled selected hidden>--:--</option>
                            <option value="08:30">08:30</option>
                            <option value="09:00">09:00</option>
                            <option value="09:30">09:30</option>
                            <option value="10:00">10:00</option>
                            <option value="10:30">10:30</option>
                            <option value="11:00">11:00</option>
                            <option value="11:30">11:30</option>
                            <option value="12:00">12:00</option>
                            <option value="12:30">12:30</option>
                            <option value="13:00">13:00</option>
                            <option value="13:30">13:30</option>
                            <option value="14:00">14:00</option>
                            <option value="14:30">14:30</option>
                            <option value="15:00">15:00</option>
                            <option value="15:30">15:30</option>
                            <option value="16:00">16:00</option>
                            <option value="16:30">16:30</option>
                            <option value="17:00">17:00</option>
                            <option value="17:30">17:30</option>
                            <option value="18:00">18:00</option>
                            <option value="18:30">18:30</option>
                            <option value="19:00">19:00</option>
                            <option value="19:30">19:30</option>
                            <option value="20:00">20:00</option>
                            <option value="20:30">20:30</option>
                            <option value="21:00">21:00</option>
                            <option value="21:30">21:30</option>
                            <option value="22:00">22:00</option>
                            <option value="22:30">22:30</option>
                        </select>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-6 mb-3">
                        <label for="cantRaquetas" class="form-label small fw-bold mb-2">Cantidad de raquetas</label>
                        <input type="number" id="cantRaquetas" name="cantRaquetas" class="form-control" min="0" max="4"
                            th:value="${reserva.asignaciones != null and !reserva.asignaciones.isEmpty() ? reserva.asignaciones[0].cantRaquetas : 0}"
                            required />
                    </div>
                    <div class="col-6 d-flex align-items-center mt-3">
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="usaLuz" name="usaLuz" value="true"
                                th:checked="${reserva.asignaciones != null and !reserva.asignaciones.isEmpty() ? reserva.asignaciones[0].usaLuz : false}" />
                            <label class="form-check-label fw-bold small" for="usaLuz">¿Usa luz?</label>
                        </div>
                    </div>
                </div>

                <div class="d-flex justify-content-end gap-2 mt-4">
                    <a th:href="@{/panelAdmin}" class="btn btn-outline-danger">Cancelar</a>
                    <button type="submit" class="btn btn-success">Guardar cambios</button>
                </div>

            </form>

        </div>

    </main>

    <div th:replace="~{fragments/base :: footer}"></div>

</body>

</html>
