<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club DamPadel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../static/css/bootstrap.min.css" th:href="@{/css/bootstrap.min.css}" />
    <link rel="stylesheet" href="../static/css/base.css" th:href="@{/css/base.css}" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body class="d-flex flex-column min-vh-100">

    <div th:replace="~{fragments/base :: header}"></div>

    <main class="mt-5">

        <form th:action="@{/editarUsuario/submit}" th:object="${usuario}" method="post" class="form-control">
            <input th:if="${usuario.id != 0}" type="hidden" name="id" th:field="*{id}" />
            <input type="text" name="nombre" th:field="*{username}" placeholder="Nombre" />
            <input type="email" name="apellidos" th:field="*{email}" placeholder="Email" />
            <input type="text" name="email" th:field="*{telefono}" placeholder="Teléfono" />
            <input type="submit" name="enviar" value="Enviar" />
        </form>

    </main>

    <div th:replace="~{fragments/base :: footer}"></div>

</body>

</html>
