<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club DamPadel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="../static/css/bootstrap.min.css" th:href="@{/css/bootstrap.min.css}" />
    <link rel="stylesheet" href="../static/css/base.css" th:href="@{/css/base.css}" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <script th:src="@{/js/comprobarPW.js}" defer></script>
    <script th:src="@{/js/modalBorrar.js}" defer></script>
</head>

<body class="d-flex flex-column min-vh-100">

    <div th:replace="~{fragments/base :: header}"></div>

    <main class="mt-5">

        <div class="container my-5 p-3 mx-auto card shadow-lg bg-secondary">

            <form th:action="@{/editarUsuario/submit}" th:object="${usuario}" method="post">

                <input type="hidden" th:field="*{id}" />
                <input type="hidden" th:field="*{password}" sec:authorize="hasRole('ADMIN')" />
                <input type="hidden" th:field="*{rolUsuario}" sec:authorize="hasRole('USER')" />

                <div class="row">

                    <div class="col-12 col-md-4">
                        <label for="username" class="form-label">Nombre de usuario</label>
                        <input type="text" th:field="*{username}" placeholder="Nombre" id="username"
                            class="form-control" th:errorclass="is-invalid" required />
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('username')}" th:errors="*{username}">
                        </div>
                    </div>

                    <div class="col-12 col-md-4">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" th:field="*{email}" placeholder="Email" id="email" class="form-control"
                            th:errorclass="is-invalid" required />
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                    </div>

                </div>

                <div class="row my-5" sec:authorize="hasRole('USER')">

                    <div class="col-12 col-md-4">
                        <label for="password" class="form-label">Contraseña</label>
                        <div class="input-group">
                            <input type="password" th:field="*{password}" placeholder="Contraseña" id="password"
                                class="form-control" th:errorclass="is-invalid" required />
                            <button class="btn btn-outline-primary" type="button" id="togglePassword">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">
                        </div>
                    </div>

                    <div class="col-12 col-md-4">
                        <label for="repetirPassword" class="form-label">Repetir contraseña</label>
                        <input type="password" id="repetirPassword" name="repetirPassword"
                            placeholder="Repite la contraseña" class="form-control" required />

                        <div class="invalid-feedback" id="repetirError" style="display: none;">
                            Las contraseñas no coinciden.
                        </div>
                    </div>

                </div>

                <div class="row my-5">

                    <div class="col-12 col-md-3">
                        <label for="telefono" class="form-label">Teléfono</label>
                        <input type="text" th:field="*{telefono}" placeholder="Teléfono" id="telefono"
                            class="form-control" th:errorclass="is-invalid" />
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}">
                        </div>
                    </div>

                    <div class="col-12 col-md-3" sec:authorize="hasRole('ADMIN')">

                        <label for="rolUsuario" class="form-label">Rol de usuario</label>
                        <select th:field="*{rolUsuario}" class="form-select" th:errorclass="is-invalid">
                            <option value="USER">USER</option>
                            <option value="ADMIN">ADMIN</option>
                        </select>

                    </div>

                </div>

                <div class="d-flex justify-content-between align-items-center mt-4">

                    <div>
                        <button type="button" sec:authorize="hasRole('USER')" class="btn btn-danger"
                            data-bs-toggle="modal" data-bs-target="#modalConfirmarBorrar"
                            th:attr="data-url=@{/borrarUsuario/{id}(id=${usuario.id})}">
                            Borrar usuario
                        </button>
                    </div>

                    <div class="d-flex gap-2">
                        <th:block sec:authorize="hasRole('ADMIN')">
                            <a th:href="@{/panelAdmin}" class="btn btn-outline-danger">Cancelar</a>
                            <button type="submit" class="btn btn-success">Guardar cambios</button>
                        </th:block>

                        <th:block sec:authorize="hasRole('USER')">
                            <a th:href="@{/perfil}" class="btn btn-outline-danger">Cancelar</a>
                            <button type="submit" class="btn btn-success">Guardar cambios</button>
                        </th:block>
                    </div>

                </div>

            </form>

        </div>

        <div class="modal fade" id="modalConfirmarBorrar" tabindex="-1" aria-labelledby="modalConfirmarBorrarLabel"
            aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content rounded-3 shadow">
                    <div class="modal-header border-0 pb-0">
                        <h5 class="modal-title fw-bold" id="modalConfirmarBorrarLabel">
                            <i class="bi bi-exclamation-triangle-fill text-danger me-2"></i>
                            Confirmar eliminación
                        </h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                    </div>
                    <div class="modal-body">
                        <p class="mb-0">¿Estás seguro de que quieres eliminar esta reserva? Esta acción no se puede
                            deshacer.</p>
                    </div>
                    <div class="modal-footer border-0 pt-0">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <a id="btnConfirmarBorrar" href="#" class="btn btn-danger fw-bold">Sí, eliminar</a>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <div th:replace="~{fragments/base :: footer}"></div>

</body>

</html>
