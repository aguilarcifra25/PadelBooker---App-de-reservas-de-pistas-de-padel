<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club DamPadel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../static/css/bootstrap.min.css" th:href="@{/css/bootstrap.min.css}" />
    <link rel="stylesheet" href="../static/css/base.css" th:href="@{/css/base.css}" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body class="d-flex flex-column min-vh-100">

    <main class="container my-5">

        <div class="col-8 mx-auto">

            <div class="card shadow border border-secondary rounded-3 font-monospace">

                <div class="card-header bg-dark text-white text-center p-4">

                    <h3 class="card-title mb-2 fw-bold">
                        <i class="bi bi-check-circle-fill me-2"></i>¡Reserva confirmada!
                    </h3>

                    <p class="card-text text-white small m-0">Resumen de tu ticket de pádel</p>

                </div>

                <div class="card-body pt-4 pb-0">

                    <div class="mb-4">

                        <h5 class="border-bottom pb-2">Datos de la reserva</h5>

                        <p class="mb-1"><strong>Usuario: </strong><span th:text="${usuario.username}"></span></p>

                        <p class="mb-1"><strong>Pista: </strong><span
                                th:text="|${pista.tipo} ${#numbers.formatInteger(pista.numero, 2)}|"></span>
                        </p>

                        <p class="mb-1"><strong>Fecha: </strong> <span
                                th:text="${#temporals.format(reserva.fecha, 'dd/MM/yyyy')}"></span></p>

                        <p class="mb-0"><strong>Horario:</strong> <span th:text="${reserva.horaEntrada}"></span> a
                            <span th:text="${reserva.horaSalida}"></span>
                        </p>

                    </div>

                    <div class="mb-4">

                        <div class="mb-4">
                            <h5 class="border-bottom pb-2">Desglose de precios</h5>

                            <ul class="list-group list-group-flush">
                                <li class="list-group-item d-flex justify-content-between align-items-center py-2">
                                    <span>Alquiler de pista (Base)</span>
                                    <span class="fw-bold"
                                        th:text="${#numbers.formatDecimal(costoPista, 1, 2, 'COMMA')} + ' €'"></span>
                                </li>

                                <li class="list-group-item d-flex justify-content-between align-items-center py-2"
                                    th:if="${usaLuz}">
                                    <span>+ Iluminación de pista (4,50 €/h)</span>
                                    <span class="fw-bold"
                                        th:text="${#numbers.formatDecimal(precioLuz, 1, 2, 'COMMA')} + ' €'"></span>
                                </li>

                                <li class="list-group-item d-flex justify-content-between align-items-center py-2"
                                    th:if="${cantRaquetas > 0}">
                                    <span th:text="|+ Alquiler de palas (${cantRaquetas} ud)|"></span>
                                    <span class="fw-bold"
                                        th:text="${#numbers.formatDecimal(precioPalas, 1, 2, 'COMMA')} + ' €'"></span>
                                </li>

                                <li th:if="${reserva.cupon != null}"
                                    class="list-group-item d-flex justify-content-between align-items-center py-2">
                                    <span th:text="|- Descuento cupón (${reserva.cupon.descuento}%)|"></span>
                                    <span class="fw-bold text-danger"
                                        th:text="'- ' + ${#numbers.formatDecimal(cupon, 1, 2, 'COMMA')} + ' €'"> </span>
                                </li>
                            </ul>
                        </div>
                    </div>

                    <div
                        class="p-4 bg-success bg-opacity-10 text-success border border-success border-opacity-50 rounded-3 text-center my-4">
                        <p class="small fw-bold text-uppercase mb-1">Importe total a pagar</p>

                        <h2 class="display-6 fw-bold"
                            th:text="${#numbers.formatDecimal(precioTotal, 1, 2, 'COMMA')} + ' €'"></h2>

                    </div>

                </div>

                <div class="card-footer text-center border border-0 py-3 mb-4">
                    <a th:href="@{/home}" class="btn btn-outline-primary me-2">
                        <i class="bi bi-house-door me-1"></i>Volver al Inicio
                    </a>
                    <button class="btn btn-info" onclick="window.print();">
                        <i class="bi bi-printer me-1"></i>Imprimir Ticket
                    </button>
                </div>

            </div>

        </div>

    </main>

    <div th:replace="~{fragments/base :: footer}"></div>

</body>

</html>
