<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club DamPadel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../static/css/bootstrap.min.css" th:href="@{/css/bootstrap.min.css}" />
    <link rel="stylesheet" href="../static/css/base.css" th:href="@{/css/base.css}" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../static/css/perfil.css" th:href="@{/css/perfil.css}">

<body class="d-flex flex-column min-vh-100">

    <div th:replace="~{fragments/base :: header}"></div>

    <main class="container my-5 mt-2 flex-grow-1">

        <div class="mt-2">
            <form th:action="@{/logout}" method="POST" id="logoutForm" class="d-none"></form>
            <a class="btn btn-outline-primary d-inline-flex align-items-center gap-2 px-4 py-2 rounded-3 shadow-sm fw-medium"
                href="#" th:href="@{/editarUsuario/{id}(id=${usuario.id})}"><i class="bi bi-pencil-square"></i>Editar
                usuario</a>
            <a class="btn btn-outline-danger d-inline-flex align-items-center gap-2 px-4 py-2 rounded-3 shadow-sm fw-medium"
                href="javascript:document.getElementById('logoutForm').submit()">
                <i class="bi bi-box-arrow-right"></i> Cerrar sesión
            </a>

        </div>

        <section class="container">
            <div th:if="${errorMensaje}" class="mx-auto mt-2">

                <p class="bg-danger text-white text-center p-3 mt-3 fw-bolder rounded">
                    <i class="bi bi-x-circle me-2 fs-5"></i>
                    <span class="fs-5" th:text="${errorMensaje}"></span>
                </p>

            </div>
        </section>

        <div class="row mb-4">
            <div class="col-12 text-center">
                <h1 class="fw-bold text-dark">Perfil de Usuario</h1>
            </div>
        </div>

        <div class="card p-4 shadow-sm mb-5 rounded-3">
            <div class="row">
                <div class="col-md-6 mb-3 text-center">
                    <h5 class="mb-1 fw-bold">Nombre de usuario</h5>
                    <p th:text="${usuario.username}"></p>
                </div>
                <div class="col-md-6 mb-3 text-center">
                    <h5 class="mb-1 fw-bold">Email</h5>
                    <p th:text="${usuario.email}"></p>
                </div>
                <div class="col-12 mt-2 text-center" th:if="${usuario.telefono != null}">
                    <h5 class="mb-1 fw-bold">Teléfono</h5>
                    <p th:text="${usuario.telefono}"></p>
                </div>
            </div>
        </div>

        <section sec:authorize="hasRole('USER')">

            <h3 class="fw-bold mb-4 text-dark border-2 border-bottom pb-2">Mis Reservas</h3>

            <div th:if="${#lists.isEmpty(usuario.reservas)}"
                class="alert alert-info shadow-sm rounded-3 p-4 d-flex flex-column flex-md-row align-items-center justify-content-between">
                <div class="d-flex align-items-center">
                    <i class="bi bi-info-circle-fill fs-4 me-3 text-info"></i>
                    <span class="fs-5 fw-medium text-dark">No tienes reservas registradas en este momento.</span>
                </div>
                <a href="pistas"
                    class="btn btn-info text-white fw-bold px-4 py-2.5 rounded-3 shadow-sm d-inline-flex align-items-center"
                    id="botonSeccionFinal">
                    <i class="bi bi-calendar4 me-2"></i> Reservar ahora
                </a>
            </div>

            <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4 mb-5"
                th:unless="${#lists.isEmpty(usuario.reservas)}">

                <div class="col" th:each="reserva : ${usuario.reservas}" id="reserva">
                    <div class="card h-100 border-1 shadow-lg rounded-3 overflow-hidden">

                        <div class="card-header bg-primary text-white py-3">
                            <h5 class="card-title mb-0 d-flex align-items-center justify-content-between">
                                <div>
                                    <i class="bi bi-calendar3 me-2"></i>
                                    <span th:text="${#temporals.format(reserva.fecha, 'dd/MM/yyyy')}"></span>
                                </div>
                                <span class="badge bg-white text-primary fs-6"
                                    th:text="'Pista ' + ${reserva.asignaciones[0].pista.tipo} + ' ' + ${#numbers.formatInteger(reserva.asignaciones[0].pista.numero, 2)}">
                                </span>
                            </h5>
                        </div>

                        <div class="card-body bg-white d-flex flex-column justify-content-between">
                            <div>
                                <p class="card-text mb-2">
                                    <i class="bi bi-box-arrow-in-right me-2 text-success"></i>
                                    <strong>Entrada:</strong> <span th:text="${reserva.horaEntrada}"></span>
                                </p>
                                <p class="card-text mb-2">
                                    <i class="bi bi-box-arrow-left me-2 text-danger"></i>
                                    <strong>Salida:</strong> <span th:text="${reserva.horaSalida}"></span>
                                </p>
                            </div>
                            <div class="mt-3 pt-3 border-top d-flex justify-content-between align-items-center">
                                <span class="small fw-medium">Total pagado</span>
                                <span class="fs-5 fw-bold text-success" th:text="${reserva.precioTotal} + ' €'">€</span>
                            </div>
                            <div class="d-flex justify-content-end mt-3">
                                <a th:href="@{/borrarReserva/{codigo}(codigo=${reserva.codigo})}"
                                    class="btn btn-sm btn-danger fw-bold">Eliminar</a>
                            </div>
                        </div>

                    </div>
                </div>
            </div>

        </section>

    </main>

    <div th:replace="~{fragments/base :: footer}"></div>

</body>

</html>
