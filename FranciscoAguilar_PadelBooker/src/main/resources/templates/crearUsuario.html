<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club DamPadel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="../static/css/bootstrap.min.css" th:href="@{/css/bootstrap.min.css}" />
    <link rel="stylesheet" href="../static/css/base.css" th:href="@{/css/base.css}" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <script th:src="@{/js/comprobarPW.js}" defer></script>
</head>

<body class="d-flex flex-column min-vh-100">

    <div th:replace="~{fragments/base :: header}"></div>

    <main>

        <section class="container">
            <div th:if="${errorMensaje}" class="mx-auto mt-2">

                <p class="bg-danger text-white text-center p-3 mt-3 fw-bolder rounded">
                    <i class="bi bi-x-circle me-2 fs-5"></i>
                    <span class="fs-5" th:text="${errorMensaje}"></span>
                </p>

            </div>
        </section>

        <div class="container my-5 p-3 mx-auto card shadow-lg bg-secondary">

            <form th:action="@{/crearUsuario/submit}" th:object="${usuario}" method="post">

                <input type="hidden" th:field="*{id}" />

                <div class="row">
                    <div class="col-12 col-md-4">
                        <label for="username" class="form-label">Nombre de usuario*</label>
                        <input type="text" th:field="*{username}" placeholder="Nombre" class="form-control"
                            th:errorclass="is-invalid" />

                        <div class="invalid-feedback" th:if="${#fields.hasErrors('username')}" th:errors="*{username}">
                        </div>
                    </div>

                    <div class="col-12 col-md-4">
                        <label for="password" class="form-label">Contraseña*</label>
                        <div class="input-group">
                            <input type="password" th:field="*{password}" placeholder="Contraseña" id="password"
                                class="form-control" th:errorclass="is-invalid" required />
                            <button class="btn btn-outline-primary" type="button" id="togglePassword">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>

                        <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">
                        </div>
                    </div>

                    <div class="col-12 col-md-4">
                        <label for="repetirPassword" class="form-label">Repetir contraseña*</label>
                        <input type="password" id="repetirPassword" name="repetirPassword"
                            placeholder="Repite la contraseña" class="form-control" required />

                        <div class="invalid-feedback" id="repetirError" style="display: none;">
                            Las contraseñas no coinciden.
                        </div>
                    </div>
                </div>

                <div class="row my-5">
                    <div class="col-12 col-md-4">
                        <label for="email" class="form-label">Email*</label>
                        <input type="email" th:field="*{email}" placeholder="Email" class="form-control"
                            th:errorclass="is-invalid" />

                        <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                    </div>

                    <div class="col-12 col-md-3">
                        <label for="telefono" class="form-label">Teléfono</label>
                        <input type="text" th:field="*{telefono}" placeholder="Teléfono" class="form-control"
                            th:errorclass="is-invalid" />

                        <div class="invalid-feedback" th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}">
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div sec:authorize="hasRole('ADMIN')" class="col-12 col-md-3">
                        <label for="rolUsuario" class="form-label">Rol de usuario*</label>
                        <select th:field="*{rolUsuario}" class="form-select" th:errorclass="is-invalid">
                            <option value="USER">USER</option>
                            <option value="ADMIN">ADMIN</option>
                        </select>

                        <div class="invalid-feedback" th:if="${#fields.hasErrors('rolUsuario')}"
                            th:errors="*{rolUsuario}">
                        </div>
                    </div>
                </div>

                <div sec:authorize="isAnonymous()">
                    <input type="hidden" th:field="*{rolUsuario}" value="USER" />
                </div>

                <div class="d-flex justify-content-end gap-2 mt-4">
                    <div sec:authorize="isAnonymous()">
                        <a th:href="@{/home}" class="btn btn-outline-danger">Cancelar</a>
                    </div>
                    <div sec:authorize="hasRole('USER')">
                        <a th:href="@{/login}" class="btn btn-outline-danger">Cancelar</a>
                    </div>
                    <div sec:authorize="hasRole('ADMIN')">
                        <a th:href="@{/panelAdmin}" class="btn btn-outline-danger">Cancelar</a>
                    </div>
                    <button type="submit" class="btn btn-success">Crear usuario</button>
                </div>

            </form>

        </div>
    </main>

    <div th:replace="~{fragments/base :: footer}"></div>

</body>

</html>
